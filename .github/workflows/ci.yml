name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: popsmosis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/popsmosis
      JWT_SECRET: ci-secret
      INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace api run db:deploy
      - run: npm --workspace api run typecheck
      - run: npm --workspace api test

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace web run typecheck
      - run: npm --workspace web run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: popsmosis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/popsmosis
      JWT_SECRET: ci-e2e-secret
      ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --workspace api run db:deploy
      - name: Start API
        run: |
          (cd api && npx tsx src/index.ts > ../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
      - name: Build and start web
        run: |
          npm --workspace web run build
          (cd web && npx next start -p 3000 > ../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000/learn && break; sleep 1; done
      - run: npm --workspace web run e2e
      - name: Server logs on failure
        if: failure()
        run: tail -100 api.log web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
