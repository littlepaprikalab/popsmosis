# Render Blueprint: the Fastify API and the Next.js web app. Postgres lives on
# Supabase (like sparks); DATABASE_URL is its Session-pooler URI.
# Deploy with Render > New > Blueprint, pointing at this repo. Everything with
# `sync: false` is prompted for on first deploy; see docs/DEPLOY.md.
#
# The web app proxies /api/* to the API server-side, so browsers only ever talk
# to popsmosis-web. Agents talk to popsmosis-api directly with their key.

services:
  - type: web
    name: popsmosis-api
    runtime: node
    region: oregon
    # Pushes to the branch do not deploy; trigger each deploy by hand (Manual
    # Deploy in the dashboard, or a deploy hook). See docs/DEPLOY.md.
    autoDeployTrigger: "off"
    # No `plan:` on purpose. Render retains the current compute plan for an
    # existing service when the field is omitted, so a sync never downgrades a
    # service you upgraded in the dashboard. A service created fresh from this
    # file gets Render's default (0.5c-512mb, i.e. paid Starter), not free.
    # Migrations run at the end of the build (env vars are available then).
    # On a paid instance you can move `db:deploy` to a `preDeployCommand`
    # instead, which blocks the deploy if a migration fails.
    # `--include=dev`: NODE_ENV=production (below) makes npm skip devDependencies,
    # and the build needs them — `tsc` here, `typescript`/`tailwindcss` on the web
    # service. Without it the build dies on a missing module.
    # `--workspace api --include-workspace-root` installs only the API's (and the
    # root's) packages. A plain `npm ci` also pulls in the web app's Next.js,
    # React and Playwright, which more than doubles node_modules (about 1 GB vs
    # 440 MB) and slows both the install and Render's upload of the build.
    buildCommand: npm ci --include=dev --workspace api --include-workspace-root && npm --workspace api run build && npm --workspace api run db:deploy
    startCommand: npm --workspace api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL           # Supabase Session-pooler URI (see docs/DEPLOY.md)
        sync: false
      - key: DATABASE_CA_CERT       # Supabase's CA (PEM text, or a Secret File's path): the API checks the database's certificate with it; set it before deploying
        sync: false
      - key: DIRECT_URL             # optional: the Session-pooler URI (port 5432) for migrations; needed only when DATABASE_URL is the transaction pooler (port 6543)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PROXY_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI     # https://<popsmosis-web host>/auth/callback
        sync: false
      - key: ALLOWED_ORIGINS         # https://<popsmosis-web host>
        sync: false
      - key: API_BASE_URL            # https://<popsmosis-api host>, substituted into the skill file
        sync: false
      - key: ADMIN_EMAILS            # comma-separated Google emails that get the admin role; anyone else signs in as a regular user
        sync: false
      - key: QUESTION_CLAIM_MINUTES  # optional: how long the queue leases a question to one run (default 20); also a knob on /admin/studio
        sync: false
      - key: QUESTION_MAX_RUNS       # optional: how many runs may start on one topic before it is given up (default 3); also a knob on /admin/studio
        sync: false
      - key: POPSMOSIS_ROUTINE_FIRE_URL   # optional: the teacher routine's API-trigger URL, so a topic wakes it at once
        sync: false
      - key: POPSMOSIS_ROUTINE_FIRE_TOKEN # optional: that trigger's bearer token, shown once when you generate it
        sync: false
      - key: R2_ACCOUNT_ID           # Cloudflare R2, where the studio uploads the droplet videos: the 32-character account ID
        sync: false
      - key: R2_ACCESS_KEY_ID        # the R2 API token's Access Key ID (Object Read & Write on droplets and studio)
        sync: false
      - key: R2_SECRET_ACCESS_KEY    # that token's Secret Access Key: signs the uploads; stays on the API
        sync: false
      - key: R2_PUBLIC_URL           # the droplets bucket's custom domain, e.g. https://media.popsmosis.com
        sync: false
      - key: VIDEO_MAX_ATTEMPTS      # optional: how many times a droplet's videos are started, recoveries included (default 2); also a knob on /admin/studio
        sync: false

  - type: web
    name: popsmosis-web
    runtime: node
    region: oregon
    autoDeployTrigger: "off"       # deploy by hand, like popsmosis-api
    # No `plan:` — see the note on popsmosis-api above.
    # `--include=dev` for the same reason as popsmosis-api: `next build` reads
    # next.config.ts, which needs `typescript` from devDependencies.
    buildCommand: npm ci --include=dev && npm --workspace web run build
    startCommand: npm --workspace web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL      # http://popsmosis-api:3001 (Render private network) or the public API URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL     # https://<popsmosis-web host>
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_REDIRECT_URI  # https://<popsmosis-web host>/auth/callback
        sync: false
      - key: NEXT_PUBLIC_INKMORY_URL  # optional: https://inkmory.com, for each lesson's link to the teacher's notes there
        sync: false
      - key: NEXT_PUBLIC_MEDIA_URL    # the API's R2_PUBLIC_URL: the one other host pages may load the droplet videos and posters from (Content-Security-Policy)
        fromService:
          name: popsmosis-api
          type: web
          envVarKey: R2_PUBLIC_URL
      - key: PROXY_SECRET
        fromService:
          name: popsmosis-api
          type: web
          envVarKey: PROXY_SECRET
